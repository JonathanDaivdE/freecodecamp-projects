<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Cards</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main id="playing-cards">
    <div class="card">
      <div class="left">
        <div class="side-char">
          <div>A</div><div>♠</div> 
        </div>
      </div>
      <div class="middle">
        <div class="middle-char">
          ♠
        </div>
      </div>
      <div class="right">
        <div class="side-char">
          <div>A</div><div>♠</div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="left">
        <div class="side-char">
          <div>2</div><div>♣</div>
        </div>
      </div>
      <div class="middle">
        <div class="middle-char">
          <div>♣</div><div class="invert">♣</div>
        </div>
      </div>
      <div class="right">
        <div class="side-char">
          <div>2</div><div>♣</div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="left">
        <div class="side-char">
          <div>3</div><div>♥</div>
        </div>
      </div>
      <div class="middle">
        <div class="middle-char">
          <div>♥</div><div>♥</div><div class="invert">♥</div>
        </div>
      </div>
      <div class="right">
        <div class="side-char">
          <div>3</div><div>♥</div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="left">
        <div class="side-char">
          <div>4</div><div>♣</div>
        </div>
      </div>
      <div class="middle">
        <div class="middle-char">
          <div>♣♣</div><div class="invert">♣♣</div>
        </div>
      </div>
      <div class="right">
        <div class="side-char">
          <div>4</div><div>♣</div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="left">
        <div class="side-char">
          <div>5</div><div>♦</div>
        </div>
      </div>
      <div class="middle">
        <div class="middle-char">
          <div>♦♦</div><div>♦</div><div>♦♦</div>
        </div>
      </div>
      <div class="right">
        <div class="side-char">
          <div>5</div><div>♦</div>
        </div>
      </div>
    </div>
  </main>
</body>

</html>
